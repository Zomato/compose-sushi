#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xms4g -Xmx8g -XX:InitialCodeCacheSize=512m -XX:ReservedCodeCacheSize=1g -XX:+UseCompressedOops -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.experimental.enableScreenshotTest=true

org.jetbrains.compose.experimental.jscanvas.enabled=true

# --- AGP 9 compatibility bridge (added with the AGP 8.13.2 -> 9.1.1 move) ---
# Both opt-outs are FeatureStage.SoftlyEnforced in AGP 9 and are REMOVED in AGP 10.0.
# builtInKotlin=false : keep applying org.jetbrains.kotlin.android (the convention plugin does this)
# newDsl=false        : keep the legacy android {} DSL + the legacy Variant API
android.builtInKotlin=false
android.newDsl=false
# restore AGP 8.13 dependency-constraint behaviour (default flipped true->false in AGP 9.0)
android.dependency.useConstraints=true
